services:
  - type: web
    name: dhya-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend/dhya-backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate resolve --rolled-back 20260923154200_add_missing_tables 2>/dev/null || true && npx prisma migrate deploy && node dist/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dhya-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: dhya-db
    plan: free
    region: singapore
